[package]
name = "voice-notes"
version = "0.2.0"
description = "Local speech-to-text with SenseVoiceSmall INT8"
edition = "2021"
rust-version = "1.78"

[lib]
name = "voice_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.8"
# 纯 Rust 音频解码器：后端直接从磁盘解码 mp3/wav/flac/ogg/m4a/mp4/mov，
# 不用 ffmpeg，也不用系统库。0.5 的 MSRV 是 1.53，0.6 要求 1.85（会破本项目的 1.78）。
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
dirs = "6"
# 日志时间戳用本地时间（chrono 已经在 tauri 的依赖树里，不增加编译成本）
chrono = "0.4"
tokio = { version = "1", features = ["sync", "time", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
