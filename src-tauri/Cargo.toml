[package]
name = "voice-notes"
version = "1.8.1"
description = "Local speech-to-text desktop app (SenseVoiceSmall offline + Zipformer streaming)"
edition = "2021"
rust-version = "1.90"

[lib]
name = "voice_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.8"
# 纯 Rust 音频解码器：后端直接从磁盘解码 mp3/wav/flac/ogg/m4a/mp4/mov，
# 不用 ffmpeg，也不用系统库。0.6 要求 Rust 1.85 —— 与本项目的 MSRV 对齐。
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
# 日志时间戳用本地时间（chrono 已经在 tauri 的依赖树里，不增加编译成本）
chrono = "0.4"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# 云端实时识别的 WebSocket 客户端。
# 0.30 要求 Rust 1.85 —— 与本项目的 MSRV 对齐；
# 它带的 tungstenite 用 rustls 0.23 + webpki-roots 0.26 —— 与仓库里
# reqwest 那套 rustls 是同一条线，不会出现两套 TLS 栈。
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
] }
# PCM 音频要 base64 上传（Realtime 的 input_audio_buffer.append）
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
