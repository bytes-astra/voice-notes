name: check

# 门禁：每次推到 main / 提 PR 都跑。
# 分两个 job：前端检查用 ubuntu（快），Rust 检查用 macOS —— 这个项目的 Rust 端
# 在 Linux 上还没验证过（cpal 要 ALSA 头文件），别把没支持的平台塞进 CI。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: i18n key 对齐
        run: npm run check:i18n

      - name: 装 Playwright 的 WebKit
        run: npx playwright install --with-deps webkit

      # 真实 WebKit 里跑一遍界面：假 window.__TAURI__，40 项检查
      - name: 界面检查
        run: npm run check:ui

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 仓库要求零警告：clippy 带 -D warnings 当门禁
      - name: clippy（零警告）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
