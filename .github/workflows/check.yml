name: check

# 门禁：每次推到 main / 提 PR 都跑。
# Rust 检查用 macOS —— 这个项目的 Rust 端在 Linux 上还没验证过
# （cpal 要 ALSA 头文件），别把没支持的平台塞进 CI。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 前端门禁：i18n 体检 + 依赖图 + 前后端拼句规则。
  # 这三个是纯 Node 脚本，跟平台无关，用 ubuntu 跑最省时间。
  # 少了它们，打破拼句规则的 PR 能同时通过两个 workflow —— 规则漂了没人拦。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: i18n 体检
        run: npm run check:i18n

      - name: 前端依赖图（单向依赖不能反、不能成环）
        run: npm run check:deps

      - name: 前后端拼句规则一致
        run: npm run check:join

      - name: 前后端命令名与载荷字段一致
        run: npm run check:contract

      - name: 打包与原生层配置（签名 / 麦克风权限 / macOS cfg）
        run: npm run check:bundle

      - name: async 路径上的阻塞锁（引擎槽）
        run: npm run check:async

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 仓库要求零警告：clippy 带 -D warnings 当门禁
      - name: clippy（零警告）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # 不需要模型的集成回归：decode_smoke 的解码用例 + 拼句纯逻辑用例。
      # 需要模型的用例在没设 *_MODEL_DIR 时会自己跳过（打印「跳过：…」后 return）。
      - name: 集成回归（不需要模型）
        run: cargo test --manifest-path src-tauri/Cargo.toml --test decode_smoke --test asr_smoke

  # Windows 编译检查：原生菜单只在 macOS 存在（menu.rs 整体 cfg 掉了），
  # import 漏了 cfg 就只有打包 Windows 时才炸 —— 每个 PR 都该拦住，
  # 别等到打 tag 才发现。
  #
  # 只编译不运行：Windows runner 上测试二进制在加载阶段就失败
  # （0xc0000139，runner 的 WebView2 依赖版本不匹配）。
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Windows 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
