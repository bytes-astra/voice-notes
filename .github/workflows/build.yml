name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: voice-notes-macos
          - os: windows-latest
            artifact: voice-notes-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check i18n keys
        run: npm run check:i18n

      # Windows 上测试二进制在加载阶段就失败（0xc0000139，runner 的 WebView2 依赖版本不匹配），
      # 所以 Windows 只编译测试；运行时测试在 macOS（以及本机）跑。
      - name: Rust unit tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture > rust-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            # 日志在 Actions 里要登录才能看；把失败尾巴写成公开的 annotation。
            msg="$(tail -n 25 rust-test.log)"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Rust test failure::$msg"
            exit "$status"
          fi

      - name: Compile Rust tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe

  # 把构建产物挂到 GitHub Release 上（Actions 的 Artifacts 90 天就过期，Release 不会）
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0 \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 没有 checkout，gh 推断不出仓库，得显式告诉它
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          cd artifacts
          mapfile -t files < <(find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name 'SHA256SUMS' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有可发布的产物"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # 同一个 tag 重新构建：覆盖旧附件
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "VoiceNotes $tag" --generate-notes --verify-tag
          fi
