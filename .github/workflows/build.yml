name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: voice-notes-macos
          - os: windows-latest
            artifact: voice-notes-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check i18n keys
        run: npm run check:i18n

      - name: Rust unit tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --nocapture > rust-test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            # 日志在 Actions 里要登录才能看；把失败尾巴写成公开的 annotation。
            msg="$(tail -n 25 rust-test.log)"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Rust test failure::$msg"
            exit "$status"
          fi

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
